{% extends "base.html" %}

{% block title %}{{ titulo }} — ARQCLIMA{% endblock %}

{% block content %}
<h1 class="h4 mb-3">{{ titulo }}</h1>

<form method="post" class="row g-3" style="max-width: 600px;">
    {% csrf_token %}
    <div class="col-12">
        <label class="form-label">Producto</label>
        {{ form.producto }}
    </div>
    <div class="col-md-6">
        <label class="form-label">Cantidad</label>
        {{ form.cantidad }}
    </div>
    <div class="col-12">
        <label class="form-label">Referencia (opcional)</label>
        {{ form.referencia_libre }}
    </div>
    {% if form.requiere_devolucion %}
    <div class="col-12 form-check">
        {{ form.requiere_devolucion }}
        <label class="form-check-label">{{ form.requiere_devolucion.label }}</label>
    </div>
    {% endif %}
    <div class="col-12">
        <button type="submit" class="btn btn-primary">Guardar</button>
    </div>
</form>
{% endblock %}
