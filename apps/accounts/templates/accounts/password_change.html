{% extends "base.html" %}

{% block title %}Cambiar contraseña — ARQCLIMA{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4 mt-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <h1 class="h4 mb-3">Cambiar mi contraseña</h1>

                {% if form.errors %}
                    <div class="alert alert-danger">
                        Revisá los datos: {{ form.errors|striptags }}
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_old_password" class="form-label">Contraseña actual</label>
                        <input type="password" name="old_password" class="form-control" id="id_old_password" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="id_new_password1" class="form-label">Nueva contraseña</label>
                        <input type="password" name="new_password1" class="form-control" id="id_new_password1" required>
                    </div>
                    <div class="mb-3">
                        <label for="id_new_password2" class="form-label">Repetir nueva contraseña</label>
                        <input type="password" name="new_password2" class="form-control" id="id_new_password2" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Cambiar contraseña</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
