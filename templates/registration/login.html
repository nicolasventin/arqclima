{% extends "base.html" %}

{% block title %}Ingresar — ARQCLIMA{% endblock %}

{% block auth_content %}
<div class="auth-brand">
    {% load static %}
    <img src="{% static 'img/arqclima-logo.svg' %}" alt="ARQCLIMA — Calefacción y Refrigeración">
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body p-4 p-sm-5">
        <h1 class="h4 mb-1">Ingresar</h1>
        <p class="text-muted mb-4">Usá tu cuenta interna para continuar.</p>

        {% if form.errors %}
            <div class="alert alert-danger">Usuario o contraseña incorrectos.</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_username" class="form-label">Usuario</label>
                <input type="text" name="username" class="form-control" id="id_username"
                       autocomplete="username" autofocus required>
            </div>
            <div class="mb-4">
                <label for="id_password" class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" id="id_password"
                       autocomplete="current-password" required>
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn btn-primary w-100">
                Ingresar
                <i class="bi bi-arrow-right ms-1"></i>
            </button>
        </form>
    </div>
</div>
{% endblock %}
