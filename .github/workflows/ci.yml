name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arqclima
          POSTGRES_PASSWORD: arqclima
          POSTGRES_DB: arqclima
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arqclima -d arqclima"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.base
      DJANGO_SECRET_KEY: ci-only-not-for-production
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://arqclima:arqclima@127.0.0.1:5432/arqclima

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Django check
        run: python manage.py check

      - name: Verificar migraciones
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: python manage.py test
